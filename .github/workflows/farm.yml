name: farm
on:
  workflow_dispatch:
    inputs:
      tutor: { description: "loo only: hand always holds this card (e.g. Griffoh) so tutored cards are measured", default: "" }
      kind: { description: "screen or pair", default: screen, type: choice, options: [screen, pair, loo] }
      cands: { description: "screen: card names one per line (empty = cands.txt)", required: false, default: "", type: string }
      slot: { description: "screen: card each candidate replaces", default: "Small World", type: string }
      deckA: { description: "baseline deck", default: "decks/ROLAD-L2.ydk", type: string }
      deckB: { description: "pair: variant deck", default: "decks/L2-rod.ydk", type: string }
      n: { description: "hands per card/deck", default: "40", type: string }
      scn: { description: "none,ash,imperm,droll,both,all", default: "none,ash", type: string }
      ht: { description: "hand-trap-in-hand credit: 1 = counts, 0 = board-only", default: "1", type: string }
      seeds: { description: "pair: 1 = also search from one seeded opener per hand card (finds the deep Medius/Nervedo lines)", default: "0", type: string }
      passes: { default: "1", type: string }
      macros: { default: "200", type: string }
      shards: { description: "parallel machines (max 20)", default: "20", type: string }
      threads: { default: "2", type: string }
permissions:
  contents: write
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        run: python3 -c "import json;print('matrix='+json.dumps({'shard':list(range(int('${{ inputs.shards }}')))}))" >> "$GITHUB_OUTPUT"
  run:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - name: banlist preflight (blocks banned/unknown cards and illegal decks)
        env: { CANDS: "${{ inputs.cands }}" }
        run: |
          node --no-warnings preflight.mjs ${{ inputs.kind == 'screen' && (inputs.cands == '' && 'cands.txt' || '/dev/null') || '/dev/null' }}
          node --no-warnings deckcheck.mjs "${{ inputs.deckA }}" ${{ inputs.kind == 'pair' && inputs.deckB || '' }}
      - name: shard
        env: { CANDS: "${{ inputs.cands }}" }
        run: |
          CF=cands.txt; if [ -n "$CANDS" ]; then printf '%s\n' "$CANDS" > cands-run.txt; CF=cands-run.txt; fi
          if [ "${{ inputs.kind }}" = "loo" ]; then
            node --no-warnings loo.mjs --deck "${{ inputs.deckA }}" --n ${{ inputs.n }} --scn ${{ inputs.scn }} --passes ${{ inputs.passes }} --macros ${{ inputs.macros }} --ht ${{ inputs.ht }} --tutor "${{ inputs.tutor }}" --threads $(nproc) --shard ${{ matrix.shard }} --of ${{ inputs.shards }}
          elif [ "${{ inputs.kind }}" = "screen" ]; then
            node --no-warnings screen.mjs --deck "${{ inputs.deckA }}" --slot "${{ inputs.slot }}" --cands "$CF" --n ${{ inputs.n }} --scn ${{ inputs.scn }} --passes ${{ inputs.passes }} --macros ${{ inputs.macros }} --ht ${{ inputs.ht }} --threads $(nproc) --shard ${{ matrix.shard }} --of ${{ inputs.shards }}
          else
            node --no-warnings realtest.mjs "${{ inputs.deckA }}" "${{ inputs.deckB }}" --mode random --n ${{ inputs.n }} --scn ${{ inputs.scn }} --passes ${{ inputs.passes }} --macros ${{ inputs.macros }} --ht ${{ inputs.ht }} --seeds ${{ inputs.seeds }} --threads $(nproc) --shard ${{ matrix.shard }} --of ${{ inputs.shards }}
          fi
      - uses: actions/upload-artifact@v4
        with: { name: "shard-${{ matrix.shard }}", path: "results/shard-${{ matrix.shard }}.json" }
  merge:
    needs: run
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with: { pattern: "shard-*", path: merged, merge-multiple: true }
      - name: report
        env: { CANDS: "${{ inputs.cands }}" }
        run: |
          CF=cands.txt; if [ -n "$CANDS" ]; then printf '%s\n' "$CANDS" > cands-run.txt; CF=cands-run.txt; fi
          if [ "${{ inputs.kind }}" = "loo" ]; then
            node --no-warnings loo.mjs --deck "${{ inputs.deckA }}" --n ${{ inputs.n }} --scn ${{ inputs.scn }} --passes ${{ inputs.passes }} --macros ${{ inputs.macros }} --ht ${{ inputs.ht }} --tutor "${{ inputs.tutor }}" --merge merged > report.md
          elif [ "${{ inputs.kind }}" = "screen" ]; then
            node --no-warnings screen.mjs --deck "${{ inputs.deckA }}" --slot "${{ inputs.slot }}" --cands "$CF" --n ${{ inputs.n }} --scn ${{ inputs.scn }} --passes ${{ inputs.passes }} --macros ${{ inputs.macros }} --ht ${{ inputs.ht }} --merge merged > report.md
          else
            node --no-warnings realtest.mjs "${{ inputs.deckA }}" "${{ inputs.deckB }}" --mode random --n ${{ inputs.n }} --scn ${{ inputs.scn }} --passes ${{ inputs.passes }} --macros ${{ inputs.macros }} --ht ${{ inputs.ht }} --seeds ${{ inputs.seeds }} --merge merged --out report.md > /dev/null
          fi
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          cat report.md
          mkdir -p reports; cp report.md reports/${{ inputs.kind }}-${{ github.run_id }}.md
          git config user.name "farm"; git config user.email "farm@users.noreply.github.com"
          git add reports; git commit -m "report ${{ github.run_id }}"; for i in 1 2 3 4 5 6; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep $((RANDOM % 8 + 2)); done
      - uses: actions/upload-artifact@v4
        with: { name: report, path: report.md }

name: lab
# Any lab script on a GitHub coordinator (pieces go to the hub helpers): push ceiling/lab.json { id, script, args }.
# Allowed scripts: pivots.mjs, games1.mjs. Results (reports/<id>.*, results/<id>.json) go to branch lab-<id>. The hub address is the HUB_URL secret.
on:
  push:
    branches: [main]
    paths: ['ceiling/lab.json']
permissions:
  contents: write   # results branch only
jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with: { path: req }
      - uses: actions/checkout@v4
        with: { ref: vm, path: lab }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: run
        working-directory: lab
        env:
          HUB_URL: ${{ secrets.HUB_URL }}
        run: |
          npm ci --no-audit --no-fund
          python3 -c "import json,os;json.dump({'url':os.environ['HUB_URL']},open('data/hub.json','w'))"
          python3 - <<'PY'
          import json
          r = json.load(open('../req/ceiling/lab.json'))
          assert r['script'] in ('pivots.mjs', 'games1.mjs')
          open('/tmp/id.txt', 'w').write(str(r['id'])); open('/tmp/script.txt', 'w').write(r['script'])
          open('/tmp/args.json', 'w').write(json.dumps({**r.get('args', {}), 'id': r['id']}))
          PY
          node --no-warnings "$(cat /tmp/script.txt)" "$(cat /tmp/args.json)" 2>&1 | grep -v -i "http" | tee /tmp/lab.out
          rm -f data/hub.json
      - name: push results
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ID=$(cat /tmp/id.txt); rm -f lab/data/hub.json
          mkdir -p /tmp/res/reports /tmp/res/results && cd /tmp/res
          cp "$GITHUB_WORKSPACE"/lab/reports/$ID.* reports/ || true
          cp "$GITHUB_WORKSPACE"/lab/results/$ID.json results/ || true
          cp /tmp/lab.out . || true
          git init -q . && git config user.name rolad-lab && git config user.email noreply@github.com
          git add -A && git commit -qm "lab results $ID"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/lab-$ID
